name: TypeScript

on: [push, pull_request]

jobs:
  TypeScript:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: Run Type Checking
        run: pnpm tsc
